<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Pulse News</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body class="auth-page">
  <a href="../index.html" class="btn-voltar">← Voltar</a>

  <a href="../index.html" class="auth-logo">
    <span>P</span> PULSE
  </a>

  <main class="auth-box">
    <div class="auth-card">

      <span class="eyebrow">PULSE NEWS</span>

      <h1>Criar conta</h1>

      <p class="muted">
        Cadastre-se para acompanhar o portal.
      </p>

      <form id="registerForm">

        <label>Nome</label>
        <input id="registerName" type="text" required>

        <label>E-mail</label>
        <input id="registerEmail" type="email" required>

        <label>Senha</label>
        <input id="registerPassword" type="password" required>

        <label>Confirmar senha</label>
        <input id="registerConfirm" type="password" required>

        <button class="btn btn-red btn-full" type="submit">
          Cadastrar
        </button>

      </form>

      <p class="auth-footer">
        Já possui uma conta?
        <a href="login.html">Entrar</a>
      </p>

    </div>
  </main>

  <script src="../script.js"></script>

</body>
</html>
